name: lint

on:
  push:
    branches:
      - master
      - main
    paths:
      - "lib/distman/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".flake8"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "lib/distman/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".flake8"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Check import ordering
        run: python -m isort --check-only --diff lib/distman tests scripts

      - name: Check Black formatting
        run: python -m black --check lib/distman tests scripts

      - name: Run Flake8 and McCabe checks
        run: python -m flake8 lib/distman tests scripts
